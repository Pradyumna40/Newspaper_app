{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Newspaper App{% endblock title%}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 shadow-sm">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">

        <!-- Brand -->
        <a href="{% url 'home' %}" class="text-xl font-bold text-gray-800 hover:text-gray-600 transition">
          TIMES OF KATHRIGUPPE
        </a>

        <!-- Nav links -->
        <div class="flex items-center gap-4">
          <a href="{% url 'home' %}" class="text-sm text-gray-600 hover:text-gray-900 transition">Home</a>

          {% if user.is_authenticated %}
            <a href="{% url 'article_new' %}" class="text-sm text-gray-600 hover:text-gray-900 transition">+ New</a>

            <!-- User dropdown (pure CSS) -->
            <div class="relative group">
              <button class="text-sm font-medium text-gray-700 hover:text-gray-900 transition flex items-center gap-1">
                {{ user.username }}
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              <div class="absolute right-0 mt-1 w-44 bg-white border border-gray-200 rounded-md shadow-lg
                          opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-150 z-50">
                <a href="{% url 'password_change' %}"
                   class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Change password</a>
                <hr class="border-gray-100">
                <form method="post" action="{% url 'logout' %}">
                  {% csrf_token %}
                  <button type="submit"
                          class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                    Logout
                  </button>
                </form>
              </div>
            </div>

          {% else %}
            <a href="{% url 'login' %}"
               class="text-sm px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-100 transition">
              Log in
            </a>
            <a href="{% url 'signup' %}"
               class="text-sm px-4 py-2 bg-gray-900 text-white rounded-md hover:bg-gray-700 transition">
              Sign up
            </a>
          {% endif %}
        </div>

      </div>
    </nav>

    <!-- Main content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
      {% block content %}{% endblock content %}
    </main>

  </body>
</html>
