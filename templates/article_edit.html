{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Article</h1>
    <form action="" method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit"
              class="mt-4 px-5 py-2 bg-blue-500 text-white text-sm font-medium rounded-md hover:bg-blue-600 transition">
        Update
      </button>
    </form>
  </div>
</div>
{% endblock content %}
