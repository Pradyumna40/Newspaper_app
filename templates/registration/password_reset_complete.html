{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-8 text-center">
    <div class="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h2 class="text-2xl font-semibold text-gray-900 mb-2">All done!</h2>
    <p class="text-sm text-gray-500 mb-6">Your new password has been set. You can now log in.</p>
    <a href="{% url 'login' %}"
       class="inline-block px-5 py-2.5 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-700 transition">
      Go to login
    </a>
  </div>
</div>
{% endblock content %}
