{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Password Change{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-8">
    <h2 class="text-2xl font-semibold text-gray-900 mb-2">Change Password</h2>
    <p class="text-sm text-gray-500 mb-6">
      Enter your old password for security, then enter your new password twice to confirm.
    </p>
    <form action="" method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit"
              class="mt-4 w-full px-5 py-2.5 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-700 transition">
        Change my password
      </button>
    </form>
  </div>
</div>
{% endblock content %}
