{% extends 'base.html' %}

{% block title %}Email Sent{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-8 text-center">
    <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </div>
    <h2 class="text-2xl font-semibold text-gray-900 mb-2">Check your inbox</h2>
    <p class="text-sm text-gray-500">
      We've emailed you instructions for resetting your password. You should receive it shortly.
    </p>
  </div>
</div>
{% endblock content %}
