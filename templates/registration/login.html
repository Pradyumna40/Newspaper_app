{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Log In{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-8">
    <h2 class="text-2xl font-semibold text-gray-900 mb-6">Log In</h2>
    <form action="" method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit"
              class="mt-4 w-full px-5 py-2.5 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-700 transition">
        Log In
      </button>
    </form>
    <p class="mt-4 text-sm text-center text-gray-500">
      <a href="{% url 'password_reset' %}" class="text-gray-700 underline hover:text-gray-900 transition">
        Forgot your password?
      </a>
    </p>
  </div>
</div>
{% endblock content %}
